[package]
name = "onianvil"
version = "1.0.0"
edition = "2021"
authors = ["OniAnvil Contributors"]
license = "MIT"
description = "An open-source, cross-platform pixel sprite and onion-skin animation studio built around game-ready atlases."
repository = "https://github.com/rbm13s/OniAnvil"

[dependencies]
egui = "0.31"
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "persistence",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "gif", "jpeg", "webp", "ico"] }
base64 = "0.22"
rfd = "0.15"
ehttp = "0.5"
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.31", default-features = false, features = [
    "wgpu",
    "accesskit",
    "x11",
    "wayland",
] }
env_logger = "0.11"
directories = "6.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlDocument", "Element"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
